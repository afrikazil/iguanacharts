<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>iguanaChart core — стенд</title>
    <style>
        :root { color-scheme: dark; }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            background: #0f1117;
            color: #d6d9e0;
            font: 13px -apple-system, Roboto, "Helvetica Neue", sans-serif;
        }
        header {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            align-items: center;
            padding: 10px 14px;
            border-bottom: 1px solid #232733;
        }
        label { display: inline-flex; gap: 6px; align-items: center; color: #8b90a0; }
        select, button, input {
            background: #1c202b;
            color: #d6d9e0;
            border: 1px solid #2a2e39;
            border-radius: 4px;
            padding: 4px 8px;
            font: inherit;
        }
        button { cursor: pointer; }
        button:hover { border-color: #3d4351; }
        #stats { margin-left: auto; font-variant-numeric: tabular-nums; color: #8b90a0; }
        #stats b { color: #d6d9e0; font-weight: 600; }
        #chart { height: calc(100vh - 92px); }
        #readout {
            padding: 6px 14px;
            border-top: 1px solid #232733;
            font-variant-numeric: tabular-nums;
            color: #8b90a0;
            height: 30px;
        }
    </style>
</head>
<body>
    <header>
        <label>Баров
            <select id="barCount">
                <option value="1000">1 000</option>
                <option value="10000">10 000</option>
                <option value="100000" selected>100 000</option>
                <option value="1000000">1 000 000</option>
            </select>
        </label>
        <label>Шкала цен
            <select id="mode">
                <option value="linear">линейная</option>
                <option value="logarithmic">логарифмическая</option>
                <option value="percentage">процентная</option>
            </select>
        </label>
        <label>Тема
            <select id="theme">
                <option value="dark" selected>тёмная</option>
                <option value="light">светлая</option>
                <option value="custom">своя</option>
            </select>
        </label>
        <button id="fit">Вписать всё</button>
        <button id="volume">Объём</button>
        <label>На цену
            <select id="overlay">
                <option value="">—</option>
                <option value="sma">SMA(30)</option>
                <option value="ema">EMA(30)</option>
                <option value="bbands">BBANDS(20)</option>
                <option value="env">ENV(20,1)</option>
                <option value="pch">PCH(13)</option>
                <option value="sar">SAR</option>
            </select>
        </label>
        <label>Пейном
            <select id="pane">
                <option value="">—</option>
                <option value="rsi">RSI(14)</option>
                <option value="macd">MACD</option>
                <option value="stoch">STOCH</option>
                <option value="adx">ADX(14)</option>
                <option value="atr">ATR(14)</option>
                <option value="cci">CCI(14)</option>
                <option value="willr">WILLR(14)</option>
                <option value="aroon">AROON(14)</option>
                <option value="mfi">MFI(14)</option>
                <option value="obv">OBV</option>
                <option value="eldr">ELDR(13)</option>
            </select>
        </label>
        <button id="stream">Пустить тики</button>
        <div id="stats"></div>
    </header>
    <div id="chart"></div>
    <div id="readout"></div>
    <script type="module" src="./main.ts"></script>
</body>
</html>
